name: Compile Release Candidate

on:
  workflow_dispatch:

jobs:
  build-release-candidate:
    if: github.ref_name == 'dev-x4pro-test'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Install font pipeline requirements
        run: uv pip install --system -r lib/EpdFont/scripts/requirements.txt

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Build X4 Pro field candidate
        run: pio run -e x4pro

      - name: Name and hash the app-only image
        run: |
          set -euo pipefail
          test "$(stat -c%s .pio/build/x4pro/firmware.bin)" -le $((0x7e0000))
          mkdir -p dist/x4pro
          cp .pio/build/x4pro/firmware.bin dist/x4pro/InkPointX-X4Pro.bin
          cp scripts/x4pro_safe_flash.py docs/FLASHING_X4PRO.txt dist/x4pro/
          (cd dist/x4pro && sha256sum InkPointX-X4Pro.bin x4pro_safe_flash.py FLASHING_X4PRO.txt > SHA256SUMS)

      - name: Upload app-only candidate
        uses: actions/upload-artifact@v6
        with:
          name: InkPointX-X4Pro-field-candidate
          path: dist/x4pro/
