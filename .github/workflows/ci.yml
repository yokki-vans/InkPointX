name: CI (build)

on:
  push:
    branches: [dev-x4pro-test]
  pull_request:

permissions:
  contents: read

jobs:
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install clang-format-21
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get update
          sudo apt-get install -y clang-format-21

      - name: Run clang-format
        run: |
          PATH="/usr/lib/llvm-21/bin:$PATH" ./bin/clang-format-fix
          git diff --exit-code || (echo "Please run 'bin/clang-format-fix' to fix formatting issues" && exit 1)

  cppcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Install font pipeline requirements
        # scripts/build_ui_fonts.py generates the UI font subsets during the
        # build and needs freetype-py + fonttools. Without this the pre-build
        # script aborts, which is why release builds only ever succeeded
        # locally and releases had to be cut by hand.
        run: uv pip install --system -r lib/EpdFont/scripts/requirements.txt

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Run cppcheck
        run: pio check --fail-on-defect medium

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Install pinned field installer tools
        run: uv pip install --system "esptool>=5.3,<5.4"

      - name: Install font pipeline requirements
        # scripts/build_ui_fonts.py generates the UI font subsets during the
        # build and needs freetype-py + fonttools. Without this the pre-build
        # script aborts, which is why release builds only ever succeeded
        # locally and releases had to be cut by hand.
        run: uv pip install --system -r lib/EpdFont/scripts/requirements.txt

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Build InkPointX X4 Pro
        run: |
          set -euo pipefail
          pio run | tee pio.log

      - name: Extract firmware stats
        run: |
          set -euo pipefail
          ram_line="$(grep -E "RAM:\\s" -m1 pio.log || true)"
          flash_line="$(grep -E "Flash:\\s" -m1 pio.log || true)"
          echo "ram_line=${ram_line}" >> "$GITHUB_OUTPUT"
          echo "flash_line=${flash_line}" >> "$GITHUB_OUTPUT"
          {
            echo "## Firmware build stats"
            if [ -n "$ram_line" ]; then echo "- ${ram_line}"; else echo "- RAM: not found"; fi
            if [ -n "$flash_line" ]; then echo "- ${flash_line}"; else echo "- Flash: not found"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce flash budget
        # Match the confirmed OEM X4 Pro app0/app1 size.
        run: |
          set -euo pipefail
          used="$(stat -c%s .pio/build/x4pro/firmware.bin)"
          limit=$((0x7e0000))
          echo "Application image: ${used} bytes (slot limit ${limit})"
          if [ "$used" -gt "$limit" ]; then
            echo "::error::Firmware size ${used} exceeds the OTA app slot (${limit} bytes)"
            exit 1
          fi

      - name: Verify X4 Pro image and runtime flash guard
        run: |
          set -euo pipefail
          firmware=.pio/build/x4pro/firmware.bin
          digest="$(sha256sum "$firmware" | cut -d' ' -f1)"
          python3 - "$firmware" "$digest" <<'PY'
          import sys
          from pathlib import Path
          from scripts import x4pro_safe_flash

          x4pro_safe_flash.require_supported_tools()
          x4pro_safe_flash.validate_firmware(Path(sys.argv[1]), sys.argv[2])
          PY
          grep -q '^# CONFIG_ESP_WIFI_NVS_ENABLED is not set$' sdkconfig.x4pro
          grep -q '^# CONFIG_ESP_PHY_CALIBRATION_AND_DATA_STORAGE is not set$' sdkconfig.x4pro
          nm="$HOME/.platformio/packages/toolchain-xtensa-esp-elf/bin/xtensa-esp32s3-elf-nm"
          for symbol in \
            __wrap_esp_partition_write \
            __wrap_esp_partition_write_raw \
            __wrap_esp_partition_erase_range; do
            "$nm" .pio/build/x4pro/firmware.elf | grep -Eq " T ${symbol}$"
          done

      - name: Name and hash the app-only image
        run: |
          set -euo pipefail
          mkdir -p dist/x4pro
          cp .pio/build/x4pro/firmware.bin dist/x4pro/InkPointX-X4Pro.bin
          cp scripts/x4pro_safe_flash.py docs/FLASHING_X4PRO_RU.txt dist/x4pro/
          (cd dist/x4pro && sha256sum InkPointX-X4Pro.bin x4pro_safe_flash.py FLASHING_X4PRO_RU.txt > SHA256SUMS)

      - name: Upload app-only artifact
        uses: actions/upload-artifact@v6
        with:
          name: InkPointX-X4Pro
          path: dist/x4pro/
          if-no-files-found: error

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Cache googletest source
        uses: actions/cache@v4
        with:
          path: build/test/_deps/googletest-src
          key: ${{ runner.os }}-googletest-${{ hashFiles('test/CMakeLists.txt') }}

      - name: Configure
        run: cmake -S test -B build/test -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/test

      - name: Run tests
        run: ctest --test-dir build/test --output-on-failure -j

      - name: Test X4 Pro fail-closed installer
        run: python3 test/x4pro_safe_flash_test.py

  # This job is used as the PR required actions check, allows for changes to other steps in the future without breaking
  # PR requirements.
  test-status:
    name: Test Status
    needs:
      - build
      - clang-format
      - cppcheck
      - unit-tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail because needed jobs failed
        # Fail if any job failed or was cancelled (skipped jobs are ok)
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - name: Success
        run: exit 0
