name: CI (build)

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install clang-format-21
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get update
          sudo apt-get install -y clang-format-21

      - name: Run clang-format
        run: |
          PATH="/usr/lib/llvm-21/bin:$PATH" ./bin/clang-format-fix
          git diff --exit-code || (echo "Please run 'bin/clang-format-fix' to fix formatting issues" && exit 1)

  cppcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Install font pipeline requirements
        # scripts/build_ui_fonts.py generates the UI font subsets during the
        # build and needs freetype-py + fonttools. Without this the pre-build
        # script aborts, which is why release builds only ever succeeded
        # locally and releases had to be cut by hand.
        run: uv pip install --system -r lib/EpdFont/scripts/requirements.txt

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Run cppcheck
        run: pio check --fail-on-defect medium

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Install font pipeline requirements
        # scripts/build_ui_fonts.py generates the UI font subsets during the
        # build and needs freetype-py + fonttools. Without this the pre-build
        # script aborts, which is why release builds only ever succeeded
        # locally and releases had to be cut by hand.
        run: uv pip install --system -r lib/EpdFont/scripts/requirements.txt

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Build CrossPoint
        run: |
          set -euo pipefail
          pio run -e gh_release | tee pio.log
          # When the platform has to rebuild the Arduino IDF libs first it runs
          # the real compile as a nested `pio run` and reports SUCCESS for the
          # outer one regardless of how the inner build ended. A failing size
          # check therefore exits 0 here. Fail on the inner summary instead.
          if grep -qE '^\s*\S+\s+FAILED\s' pio.log; then
            echo "::error::A PlatformIO environment reported FAILED"
            grep -E '^\s*\S+\s+FAILED\s' pio.log
            exit 1
          fi

      - name: Validate localization and generated UI fonts
        run: python scripts/validate_i18n.py

      - name: Extract firmware stats

        run: |
          set -euo pipefail
          # Take the LAST occurrence: the nested Arduino-core build prints its
          # own much smaller RAM/Flash lines first, and -m1 reported those.
          ram_line="$(grep -E "RAM:\\s" pio.log | tail -n1 || true)"
          flash_line="$(grep -E "Flash:\\s" pio.log | tail -n1 || true)"
          echo "ram_line=${ram_line}" >> "$GITHUB_OUTPUT"
          echo "flash_line=${flash_line}" >> "$GITHUB_OUTPUT"
          {
            echo "## Firmware build stats"
            if [ -n "$ram_line" ]; then echo "- ${ram_line}"; else echo "- RAM: not found"; fi
            if [ -n "$flash_line" ]; then echo "- ${flash_line}"; else echo "- Flash: not found"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce flash budget
        # The 6.25 MiB app slot is fixed for the fielded fleet (the partition
        # table cannot change over OTA). Reject an image that cannot fit in
        # either application partition.
        run: |
          set -euo pipefail
          # Measure the artifact that actually gets written to the slot rather
          # than parsing pio.log: the previous `-m1` match picked the nested
          # core build's RAM line ("used 37276 bytes"), so an image over the
          # slot still passed this gate.
          image=.pio/build/gh_release/firmware.bin
          if [ ! -f "$image" ]; then
            echo "::error::${image} was not produced"
            exit 1
          fi
          used="$(wc -c < "$image")"
          limit=$((0x640000))
          echo "Flash image: ${used} bytes (limit ${limit})"
          if [ "$used" -gt "$limit" ]; then
            echo "::error::Firmware size ${used} exceeds the OTA app slot (${limit} bytes)"
            exit 1
          fi

      - name: Upload firmware.bin artifact
        uses: actions/upload-artifact@v6
        with:
          name: firmware.bin
          path: .pio/build/gh_release/firmware.bin
          if-no-files-found: error

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Cache googletest source
        uses: actions/cache@v4
        with:
          path: build/test/_deps/googletest-src
          key: ${{ runner.os }}-googletest-${{ hashFiles('test/CMakeLists.txt') }}

      - name: Configure
        run: cmake -S test -B build/test -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/test

      - name: Run tests
        run: ctest --test-dir build/test --output-on-failure -j

  # This job is used as the PR required actions check, allows for changes to other steps in the future without breaking
  # PR requirements.
  test-status:
    name: Test Status
    needs:
      - build
      - clang-format
      - cppcheck
      - unit-tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail because needed jobs failed
        # Fail if any job failed or was cancelled (skipped jobs are ok)
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - name: Success
        run: exit 0
