name: Compile X4 Pro Release

on:
  push:
    tags:
      - 'v*-x4pro-*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install build dependencies
        run: |
          python3 -m pip install -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          python3 -m pip install -r lib/EpdFont/scripts/requirements.txt
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Run host tests
        run: |
          cmake -S test -B build/test -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/test
          ctest --test-dir build/test --output-on-failure -j
          python3 test/x4pro_safe_flash_test.py

      - name: Run static analysis
        run: pio check -e x4pro --fail-on-defect medium

      - name: Verify tag matches firmware version
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk -F= '/^version[[:space:]]*=/{gsub(/[[:space:]]/, "", $2); print $2; exit}' platformio.ini)"
          test "${GITHUB_REF_NAME}" = "${version}"

      - name: Build X4 Pro application image
        run: pio run -e x4pro

      - name: Package app-only release
        shell: bash
        run: |
          set -euo pipefail
          build_dir=.pio/build/x4pro
          test "$(stat -c%s "$build_dir/firmware.bin")" -le $((0x7e0000))
          mkdir -p dist/x4pro
          cp "$build_dir/firmware.bin" dist/x4pro/InkPointX-X4Pro.bin
          cp scripts/x4pro_safe_flash.py docs/FLASHING_X4PRO_RU.txt dist/x4pro/
          (cd dist/x4pro && sha256sum InkPointX-X4Pro.bin x4pro_safe_flash.py FLASHING_X4PRO_RU.txt > SHA256SUMS)

      - name: Upload CI artifact
        uses: actions/upload-artifact@v6
        with:
          name: InkPointX-X4Pro-${{ github.ref_name }}
          path: dist/x4pro/

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          assets=(
            dist/x4pro/InkPointX-X4Pro.bin
            dist/x4pro/SHA256SUMS
            dist/x4pro/x4pro_safe_flash.py
            dist/x4pro/FLASHING_X4PRO_RU.txt
          )
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" --repo "${{ github.repository }}" --clobber "${assets[@]}"
          else
            gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" \
              --title "InkPointX X4 Pro ${{ github.ref_name }}" \
              --notes "Experimental app-only ESP32-S3 firmware for XTEINK X4 Pro. A full backup and the bundled safe installer are mandatory. No factory image is provided." \
              "${assets[@]}"
          fi
