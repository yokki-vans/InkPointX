name: Compile Release
on:
  push:
    tags:
      - 'v*'

concurrency:
  group: firmware-release
  cancel-in-progress: false

permissions:
  contents: write  # required to publish the release from this workflow

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify release commit is already on dev
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/dev:refs/remotes/origin/dev
          release_commit="$(git rev-list -n 1 "${GITHUB_REF}")"
          dev_commit="$(git rev-parse refs/remotes/origin/dev)"
          if ! git merge-base --is-ancestor "${release_commit}" "${dev_commit}"; then
            echo "::error::Release commit ${release_commit} is not on origin/dev (${dev_commit})"
            exit 1
          fi

      - name: Verify release metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk -F= '/^version[[:space:]]*=/{gsub(/[[:space:]]/, "", $2); print $2; exit}' platformio.ini)"
          if [ "${GITHUB_REF_NAME}" != "${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match platformio.ini version ${version}"
            exit 1
          fi
          notes_file="docs/releases/${GITHUB_REF_NAME}.md"
          if [ ! -s "${notes_file}" ]; then
            echo "::error::Missing release notes: ${notes_file}"
            exit 1
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Install font pipeline requirements
        # scripts/build_ui_fonts.py generates the UI font subsets during the
        # build and needs freetype-py + fonttools. Without this the pre-build
        # script aborts, which is why release builds only ever succeeded
        # locally and releases had to be cut by hand.
        run: uv pip install --system -r lib/EpdFont/scripts/requirements.txt

      - name: Install host-test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Run host unit tests
        run: |
          cmake -S test -B build/test -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/test
          ctest --test-dir build/test --output-on-failure -j

      - name: Run static analysis
        run: pio check --fail-on-defect medium

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Build universal X3/X4 firmware
        shell: bash
        run: |
          set -euo pipefail
          pio run -e gh_release | tee pio.log
          # A first-time Arduino IDF core rebuild runs the real compile as a
          # nested `pio run` whose exit status the outer one discards, so a
          # failed link or size check can still exit 0 and leave a stale
          # firmware.bin for the steps below to sign and publish.
          if grep -qE '^\s*\S+\s+FAILED\s' pio.log; then
            echo "::error::gh_release reported FAILED"
            grep -E '^\s*\S+\s+FAILED\s' pio.log
            exit 1
          fi

      - name: Verify embedded firmware version
        run: python scripts/verify_firmware_version.py .pio/build/gh_release/firmware.bin "${GITHUB_REF_NAME}"

      - name: Validate localization and generated UI fonts
        run: python scripts/validate_i18n.py

      - name: Enforce production flash budget
        shell: bash
        run: |
          set -euo pipefail
          used="$(stat -c%s .pio/build/gh_release/firmware.bin)"
          # app0/app1 are both 0x640000 bytes in partitions.csv. Keep the CI
          # assertion tied to the actual OTA slot instead of an obsolete
          # historical image-size threshold.
          limit=$((0x640000))
          echo "Release image: ${used} bytes (limit ${limit})"
          test "${used}" -le "${limit}"

      - name: Package device-labelled release assets
        shell: bash
        run: |
          set -euo pipefail
          build_dir=.pio/build/gh_release
          tag="${GITHUB_REF_NAME}"
          # Stock X3/X4 recovery looks only for this exact filename. It is the
          # same app-partition image as firmware.bin, not a merged bootloader or
          # partition-table package.
          cp "$build_dir/firmware.bin" "$build_dir/update.bin"
          cp "$build_dir/firmware.bin" "$build_dir/InkPointX-${tag}-X3-X4.bin"
          cp "$build_dir/firmware.bin" "$build_dir/InkPointX-${tag}-X3.bin"
          cp "$build_dir/firmware.bin" "$build_dir/InkPointX-${tag}-X4.bin"
          (
            cd "$build_dir"
            sha256sum firmware.bin update.bin "InkPointX-${tag}-X3-X4.bin" \
              "InkPointX-${tag}-X3.bin" "InkPointX-${tag}-X4.bin" > SHA256SUMS
          )

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CrossPoint-${{ github.ref_name }}
          path: |
            .pio/build/gh_release/bootloader.bin
            .pio/build/gh_release/firmware.bin
            .pio/build/gh_release/update.bin
            .pio/build/gh_release/firmware.elf
            .pio/build/gh_release/firmware.map
            .pio/build/gh_release/partitions.bin
            .pio/build/gh_release/InkPointX-${{ github.ref_name }}-X3-X4.bin
            .pio/build/gh_release/InkPointX-${{ github.ref_name }}-X3.bin
            .pio/build/gh_release/InkPointX-${{ github.ref_name }}-X4.bin
            .pio/build/gh_release/SHA256SUMS

      # The on-device updater reads releases/latest and looks for an asset
      # named exactly firmware.bin (src/network/OtaUpdater.cpp). Publishing the
      # release here is what makes a tag reach existing devices over the air —
      # before this, releases were created by hand and a tag alone shipped
      # nothing.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          notes_file="docs/releases/${{ github.ref_name }}.md"
          release_notes=(--notes-file "$notes_file")
          # Idempotent: a release may already exist if the tag was cut by hand
          # (gh release create also creates the tag, which fires this workflow).
          # In that case attach/replace the CI-built binary instead of failing.
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} exists; uploading X3/X4 firmware assets"
            gh release upload "${{ github.ref_name }}" \
              --repo "${{ github.repository }}" --clobber \
              .pio/build/gh_release/firmware.bin \
              .pio/build/gh_release/update.bin \
              .pio/build/gh_release/InkPointX-${{ github.ref_name }}-X3-X4.bin \
              .pio/build/gh_release/InkPointX-${{ github.ref_name }}-X3.bin \
              .pio/build/gh_release/InkPointX-${{ github.ref_name }}-X4.bin \
              .pio/build/gh_release/SHA256SUMS
          else
            gh release create "${{ github.ref_name }}" \
              --repo "${{ github.repository }}" \
              --title "InkPoint X ${{ github.ref_name }}" \
              "${release_notes[@]}" \
              .pio/build/gh_release/firmware.bin \
              .pio/build/gh_release/update.bin \
              .pio/build/gh_release/InkPointX-${{ github.ref_name }}-X3-X4.bin \
              .pio/build/gh_release/InkPointX-${{ github.ref_name }}-X3.bin \
              .pio/build/gh_release/InkPointX-${{ github.ref_name }}-X4.bin \
              .pio/build/gh_release/SHA256SUMS
          fi
